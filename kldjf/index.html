<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <!--<title>全新骷髅打金服，高攻高爆！爆装不停！</title>-->
    <title>Loading...</title>
    <style>
        #video{
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
    <body>
        <h1 id="loadingTitle">Loading Resources...</h1>
        <a id="textAudio">Resource 1
            <progress id="progressAudio" max="100" value="0"></progress>
        </a>
        <a id="textVideo"><br>Resource 2
            <progress id="progressVideo" max="100" value="0"></progress>
        </a>
        <script>
            (()=>{
                const loadingTitle = document.getElementById('loadingTitle');
                const textAudio = document.getElementById('textAudio');
                const progressAudio = document.getElementById('progressAudio');
                const textVideo = document.getElementById('textVideo');
                const progressVideo = document.getElementById('progressVideo');
                let loadAudioSuccess = false;
                let loadVideoSuccess = false;
                let mainDiv;

                function updateState(){
                    loadAudioSuccess = localStorage.getItem('bg.mp3')=="1";
                    loadVideoSuccess = localStorage.getItem('bg.mp4')=="1";
                }

                async function downloadRes(res,progressBar){
                    const resp = await fetch(`./assets/${res}`);
                    const root = await navigator.storage.getDirectory();
                    const file = await root.getFileHandle(res,{create:true});
                    const writable = await file.createWritable();
                    const totalSize = Number(resp.headers.get('Content-Length'));
                    let currentSize = 0;
                    if (!totalSize){
                        throw Error("Unknown resource size");
                    }
                    const reader = resp.body.getReader();
                    for(;;){
                        const {done, value} = await reader.read();
                        if (done) break;
                        currentSize += value.byteLength;
                        let progress = currentSize/totalSize*100;
                        progressBar.value = progress.toString();
                        await writable.write(value);
                    }
                    await writable.close();
                    localStorage.setItem(res, '1');
                }

                let tryPlayMedia = ()=>{};

                function fullscreen(element) {
                    if (element.requestFullscreen) {
                        element.requestFullscreen();
                    } 
                    else if (element.mozRequestFullScreen) { // Firefox
                        element.mozRequestFullScreen();
                    } 
                    else if (element.webkitRequestFullscreen) { // Chrome, Safari and Opera
                        element.webkitRequestFullscreen();
                    } 
                    else if (element.msRequestFullscreen) { // IE/Edge
                        element.msRequestFullscreen();
                    }
                }

                async function loadWebsite(){
                    console.info("loading website");
                    const root = await navigator.storage.getDirectory();
                    const fileAudio = await root.getFileHandle('bg.mp3');
                    const blobAudio = await fileAudio.getFile();
                    const bufAudio = await blobAudio.arrayBuffer();
                    const fileVideo = await root.getFileHandle('bg.mp4');
                    const blobVideo = await fileVideo.getFile();
                    const bufVideo = await blobVideo.arrayBuffer();
                    console.info(`audio=${blobAudio.size} video=${blobVideo.size}`);
                    const urlAudio = URL.createObjectURL(blobAudio);
                    const urlVideo = URL.createObjectURL(blobVideo);
                    console.info(`audio=${urlAudio} video=${urlVideo}`);
                    loadingTitle.hidden = true;
                    textAudio.hidden = true;
                    textVideo.hidden = true;
                    mainDiv = document.createElement('div');
                    document.body.appendChild(mainDiv);
                    mainDiv.innerHTML = `
                    <video id="video" loop maintainAspectRatio autoplay muted>
                        <source src="${urlVideo}" type="video/mp4">
                    </video>
                    <audio id="audio" loop autoplay muted>
                        <source src="${urlAudio}" type="audio/mpeg">
                    </audio>`
                    const bgVideo = document.getElementById('video');
                    const bgAudio = document.getElementById('audio');
                    if (!bgVideo||!bgAudio){
                        throw Error("fill html error");
                    }
                    tryPlayMedia = ()=>{
                        try {
                            if (bgAudio.paused) bgAudio.play();
                        }
                        catch {}
                    }
                    window.onclick = tryPlayMedia;
                    window.onscroll = tryPlayMedia;
                    window.onmousemove = tryPlayMedia;
                    window.onmouseenter = tryPlayMedia;
                    window.onpageshow = tryPlayMedia;
                    const tmpButton = document.createElement('button');
                    tmpButton.onclick = tryPlayMedia;
                    tryPlayMedia();
                    setTimeout(()=>{
                        try{fullscreen(bgVideo);}catch{}
                        try{tmpButton.click();}catch{}
                        try{bgAudio.muted=false;}catch{}
                    },200);
                }

                updateState();
                const ok = ()=>{
                    updateState();
                    if (loadAudioSuccess&&loadVideoSuccess){
                        console.info("ok");
                        loadWebsite().then().catch(console.error);
                    }
                }
                const err = (e)=>{
                    loadingTitle.innerText = "Load failed!";
                    console.error(`load failed: ${e}`);
                }

                if (loadAudioSuccess){
                    progressAudio.value = "100";
                    console.info("audio is ok");
                }
                else {
                    downloadRes('bg.mp3',progressAudio)
                    .then(ok)
                    .catch(err);
                }
                if (loadVideoSuccess){
                    progressVideo.value = "100";
                    console.info('video is ok');
                }
                else {
                    downloadRes('bg.mp4',progressVideo)
                    .then(ok)
                    .catch(err);
                }
                ok();                
            })()
        </script>
    </body>
</html>
